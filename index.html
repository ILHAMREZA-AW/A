<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colour Clash | Ilham</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at top, #2a2f5c 0%, #12142b 70%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: 1.5rem;
  }
  .game {
    width: 100%; max-width: 520px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 22px;
    padding: 2rem 1.6rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
  h1 span { background: linear-gradient(90deg,#ff5d5d,#ffd23f,#4dd599,#4d9fff,#b36bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .byline { font-size: 0.8rem; color: #9aa0c7; margin-top: 0.2rem; }
  .rules { margin: 1.2rem 0; font-size: 0.92rem; color: #c8ccec; }
  .rules b { color: #ffd23f; }

  .stats { display: flex; justify-content: space-between; gap: 0.6rem; margin: 1rem 0; }
  .stat { flex: 1; background: rgba(0,0,0,0.25); border-radius: 12px; padding: 0.6rem 0.2rem; }
  .stat small { display: block; font-size: 0.68rem; letter-spacing: 1px; color: #9aa0c7; text-transform: uppercase; }
  .stat strong { font-size: 1.4rem; }

  .stage {
    background: #0b0d20; border-radius: 16px;
    min-height: 140px; display: flex; align-items: center; justify-content: center;
    margin: 1rem 0;
  }
  #word { font-size: clamp(3rem, 14vw, 4.5rem); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

  .answer { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  .answer input {
    flex: 1; padding: 0.85rem 1rem; font-size: 1rem; font-family: inherit;
    border-radius: 12px; border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08); color: #fff; outline: none;
  }
  .answer input:focus { border-color: #ffd23f; }
  .answer input::placeholder { color: #8b91bb; }

  button { font-family: inherit; cursor: pointer; border: none; transition: transform .12s, opacity .2s; }
  button:active { transform: scale(0.95); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  .submit { padding: 0 1.4rem; border-radius: 12px; background: #ffd23f; color: #12142b; font-weight: 700; }

  .colour-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
  .cbtn { padding: 0.8rem 0; border-radius: 12px; font-weight: 700; font-size: 0.95rem; color: #fff; text-transform: capitalize; }
  .cbtn[data-c="yellow"] { color: #222; }

  #feedback { min-height: 1.6rem; margin-top: 1rem; font-weight: 600; }
  .good { color: #4dd599; }
  .bad { color: #ff6b6b; }

  .start {
    width: 100%; padding: 1rem; border-radius: 14px; margin-top: 0.4rem;
    background: linear-gradient(90deg,#ff5d5d,#ffa23f); color: #fff; font-size: 1.05rem; font-weight: 700;
  }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .pop { animation: pop .25s; }
  @keyframes pop { 50% { transform: scale(1.06); } }
</style>
</head>
<body>

<div class="game" id="game">
  <h1><span>Colour Clash</span></h1>
  <div class="byline">A game by Ilham &middot; Paralegal, A.W. Law LLC</div>

  <p class="rules">The word will lie to you. Type or tap the <b>colour of the ink</b>, not what the word says. You have 30 seconds!</p>

  <div class="stats">
    <div class="stat"><small>Score</small><strong id="score">0</strong></div>
    <div class="stat"><small>Streak</small><strong id="streak">0</strong></div>
    <div class="stat"><small>Time</small><strong id="time">30</strong></div>
    <div class="stat"><small>Best</small><strong id="best">0</strong></div>
  </div>

  <div class="stage" id="stage"><div id="word" style="color:#fff">READY?</div></div>

  <form class="answer" id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Type the ink colour..." disabled>
    <button type="submit" class="submit" id="submitBtn" disabled>Check</button>
  </form>

  <div class="colour-buttons" id="buttons"></div>

  <div id="feedback"></div>

  <button class="start" id="startBtn">Start Game</button>
</div>

<script>
  const COLOURS = {
    red:    '#ff3b3b',
    green:  '#2ecc71',
    blue:   '#3d8bff',
    yellow: '#ffd800',
    purple: '#a64dff',
    orange: '#ff8c1a'
  };
  const names = Object.keys(COLOURS);

  const wordEl = document.getElementById('word');
  const stage = document.getElementById('stage');
  const input = document.getElementById('input');
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const startBtn = document.getElementById('startBtn');
  const feedback = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const streakEl = document.getElementById('streak');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const buttonsEl = document.getElementById('buttons');

  let score = 0, streak = 0, best = 0, timeLeft = 30, timer = null;
  let inkColour = '', playing = false;

  // Build colour buttons
  names.forEach(n => {
    const b = document.createElement('button');
    b.className = 'cbtn';
    b.dataset.c = n;
    b.textContent = n;
    b.style.background = COLOURS[n];
    b.disabled = true;
    b.addEventListener('click', () => checkAnswer(n));
    buttonsEl.appendChild(b);
  });

  function setControls(on) {
    input.disabled = !on;
    submitBtn.disabled = !on;
    document.querySelectorAll('.cbtn').forEach(b => b.disabled = !on);
  }

  function newRound() {
    const text = names[Math.floor(Math.random() * names.length)];
    let ink;
    do { ink = names[Math.floor(Math.random() * names.length)]; } while (ink === text);
    inkColour = ink;
    wordEl.textContent = text;
    wordEl.style.color = COLOURS[ink];
    wordEl.classList.remove('pop');
    void wordEl.offsetWidth;
    wordEl.classList.add('pop');
    input.value = '';
    input.focus();
  }

  function checkAnswer(answer) {
    if (!playing) return;
    answer = answer.trim().toLowerCase();
    if (!answer) return;

    if (answer === inkColour) {
      streak++;
      score += 10 + Math.min(streak - 1, 5) * 2; // small streak bonus
      feedback.innerHTML = '<span class="good">✔ Correct!</span>';
    } else {
      streak = 0;
      stage.classList.remove('shake');
      void stage.offsetWidth;
      stage.classList.add('shake');
      feedback.innerHTML = '<span class="bad">✘ Wrong! The ink was ' + inkColour.toUpperCase() + '</span>';
    }
    scoreEl.textContent = score;
    streakEl.textContent = streak;
    newRound();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    checkAnswer(input.value);
  });

  function startGame() {
    score = 0; streak = 0; timeLeft = 30; playing = true;
    scoreEl.textContent = 0; streakEl.textContent = 0; timeEl.textContent = 30;
    feedback.textContent = '';
    startBtn.style.display = 'none';
    setControls(true);
    newRound();
    clearInterval(timer);
    timer = setInterval(() => {
      timeLeft--;
      timeEl.textContent = timeLeft;
      if (timeLeft <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    clearInterval(timer);
    playing = false;
    setControls(false);
    if (score > best) { best = score; bestEl.textContent = best; }
    wordEl.textContent = 'TIME!';
    wordEl.style.color = '#fff';
    feedback.innerHTML = 'Final score: <b>' + score + '</b>' + (score === best && score > 0 ? ' 🏆 New best!' : '');
    startBtn.textContent = 'Play Again';
    startBtn.style.display = 'block';
  }

  startBtn.addEventListener('click', startGame);
</script>

</body>
</html>
